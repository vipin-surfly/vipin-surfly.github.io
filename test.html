<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Demo host – Webfuse on custom domain</title>

  <!-- 1️⃣ stub – must appear BEFORE the script -->
  <script>
    // If the real SDK hasn't loaded yet, we keep a queue.
    window.webfuse = window.webfuse || function () {};
    window.webfuse.q = window.webfuse.q || [];
    window.webfuse.initSpace = function () {
      // Save the call arguments for later replay.
      window.webfuse.q.push(['initSpace', arguments]);
    };
  </script>

  <!-- 2️⃣ load the widget from *your* delegated domain -->
  <script async src="https://webfu.se/surfly.js"></script>

  <!-- 3️⃣ call initSpace immediately – the stub will queue it -->
  <script>
    const widgetKey = 'wk_uyBAlAjQKqBEBKC_NmXIe5k__1XwmAOA';   // <-- replace
    const spaceId   = '3590';    // <-- replace
    const settings  = {};                 // any extra integration settings

    webfuse.initSpace(widgetKey, spaceId, settings);
  </script>

  <!-- 4️⃣ listen for the session start and print the join URL -->
  <script>
    webfuse.on('session_started', data => {
      // `sessionLink` is the URL a follower must use.
      console.log('JOIN_URL:', data.sessionLink || data.link);
    });
  </script>
</head>

<body>
  <h1>Demo host page</h1>
  <p>Open the console (⎈⌘I) and watch for the “JOIN_URL:” line after you share a site.</p>

  <!-- a place where the session will be rendered -->
  <iframe id="wf-iframe"
          allow="autoplay *; camera *; microphone *; clipboard-write *"
          referrerpolicy="no-referrer"
          style="width:100%; height:500px; border:none;"></iframe>

  <script>
    // Kick‑off the Webfuse session as soon as the script is ready.
    // The SDK will fill the iframe automatically.
    webfuse.on('ready', () => {
      // `space.session(undefined, ...)` creates the session and boots the iframe.
      // No arguments needed for this demo.
      webfuse.space.session();
    });
  </script>
</body>
</html>
